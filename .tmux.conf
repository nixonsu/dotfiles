# =========================
# Reload config
# =========================
bind-key r source-file ~/.tmux.conf

# =========================
# Terminal / colors
# =========================
set -g default-terminal "tmux-256color"

# =========================
# History / responsiveness
# =========================
set-option -g history-limit 50000
set -g escape-time 0

# =========================
# Default shell (Windows-safe)
# =========================
set -g default-shell powershell

# =========================
# Window / pane numbering
# =========================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =========================
# Sessionizer / helper commands
# =========================
# Example placeholders:
bind-key -n C-a new-window "powershell -File C:/Users/NixonUch/scripts/tmux/tmux-sessionizer.ps1"
bind-key -n C-g new-window "lazygit"

bind-key -n C-x kill-pane

# =========================
# Copy mode (vi style)
# =========================
bind-key -n C-s copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection

# Use Windows clipboard instead of pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "Set-Clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "Set-Clipboard"

# =========================
# New window in current path
# =========================
bind-key c new-window -c "#{pane_current_path}"

# =========================
# Pane navigation
# =========================
bind-key -r Tab select-pane -t :.+

# =========================
# Plugins (PSMux equivalents)
# =========================
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# Automatic restore
set -g @continuum-restore 'on'

# =========================
# Catppuccin theme options
# These may not all match 1:1 with the tmux plugin, but the flavor setting is a safe start
# =========================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin-show-powerline 'on'
set -g @catppuccin-window-style 'rounded'

# =========================
# Initialize plugin manager (keep at bottom)
# =========================
run '~/.psmux/plugins/ppm/ppm.ps1' 

